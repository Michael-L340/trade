<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' blob: data:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'self'; form-action 'self'">
<title>交易日志</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css?v=0.1.0">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <h1 class="brand">交易日志</h1>
      <span class="tag-demo" id="demo-tag" hidden>示例数据</span>
      <button type="button" class="btn link" id="exit-demo" hidden>退出示例</button>
    </div>
    <div class="topbar-right">
      <button type="button" class="save-state btn link" id="save-state" title="去设置页备份"><span class="ok" aria-hidden="true">✓</span><span id="save-text">只保存在这个浏览器里</span></button>
      <button type="button" class="btn" id="export-csv">导出 CSV</button>
      <button type="button" class="btn" id="go-settings">设置</button>
    </div>
  </div>
</header>

<div class="banner" id="banner" role="status" hidden></div>

<main class="page" id="view-main">
  <section class="overview" aria-label="全部交易的统计">
    <div id="summary"></div>
    <div id="chart"></div>
  </section>
  <section id="sheet"></section>
  <p class="version" id="version"></p>
</main>

<main class="page" id="view-settings" hidden>
  <div class="settings-head">
    <h2 class="settings-title">设置</h2>
    <button type="button" class="btn" id="back-main">返回交易表</button>
  </div>
  <div class="settings" id="settings"></div>
</main>

<div id="detail-root"></div>
<noscript>这个网站需要开启 JavaScript。</noscript>
<script type="module" src="src/main.js?v=0.1.0"></script>
</body>
</html>
