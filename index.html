<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' blob: data:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>交易日志</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap">
<link rel="stylesheet" href="styles.css">
<script src="vendor/supabase.js"></script>
<script type="module" src="src/main.js"></script>
</head>
<body>
<!-- 页面骨架。内容由 src/main.js 挂上去；这里不写内联脚本和 style=""（内容安全策略不允许）。所有路径都是相对路径（网站部署在 /trade-journal/ 下）。 -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <h1 class="brand">交易日志</h1>
      <span class="tag-demo" id="demo-tag" hidden>示例数据</span>
      <button type="button" class="btn link" id="demo-exit" hidden>退出示例</button>
    </div>
    <div class="topbar-right">
      <span class="save-state" id="save-state"><a class="save-link" href="#/settings">只保存在这个浏览器里（点击登录）</a></span>
      <button type="button" class="btn" id="export-csv">导出 CSV</button>
      <a class="btn" id="open-settings" href="#/settings">设置</a>
    </div>
  </div>
</header>

<div class="banners" id="banners"></div>

<main class="page" id="page-sheet">
  <section class="overview" aria-label="全部交易的统计和累计 R 曲线">
    <div class="panel stats" id="summary"></div>
    <div class="panel" id="chart"></div>
  </section>
  <section class="sheet-wrap" id="sheet" aria-label="交易表">
    <p class="loading" id="loading">正在载入…</p>
    <noscript><p class="loading">这个网站需要开启 JavaScript 才能使用。</p></noscript>
  </section>
</main>

<main class="page" id="page-settings" aria-label="设置" hidden></main>

<footer class="page-foot">
  <p class="version" id="app-version"></p>
</footer>

<div class="overlay" id="detail" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="toast toast-aux" id="toast-aux" role="status" aria-live="polite" hidden></div>
</body>
</html>
